<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>To-Do List</title>
</head>
<body>
    <!-- Entete de la page -->
    <header>
        <nav class="navbar">
            <h1>To-Do List IND G3</h1>
            <!-- Menu de navigation -->
            <div class="menu">
                <!-- Bouton d'ajout utilisateur -->
                <button type="button" id="addUserBtn" class="btn menu-btn">Ajouter un utilisateur</button>
                <!-- Bouton pour ajouter une tâche -->
                <button type="button" id="addTaskBtn" class="btn menu-btn">Ajouter une tâche</button>
            </div>
        </nav>
    </header>
    <!-- Contenu Principal -->
    <main class="main-content">
        <aside class="sidebar-user">
            <h3>Gestion utilisateur</h3>
            <table id="user-table" class="table user-table">
                <caption>Liste des utilisateurs</caption>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Les utilisateurs seront ajoutés dynamiquement ici -->
                </tbody>
            </table>
            <button id="archive-user-btn" class="btn"><img src="assets/archive-icon.png" class="archive-icon" alt="archive-icon">Archives</button>
            <table id="user-archive-table" class="table hidden user-table">
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Les utilisateurs archivés seront ajoutés dynamiquement ici -->
                </tbody>
            </table>
        </aside>
        <section class="task-section">
            <h3>Liste des tâches</h3>
            <table id="task-table" class="table task-table">
                <caption>Liste des tâches</caption>
                <thead>
                    <tr>
                        <th>Nom de la tâche</th>
                        <th>Terminé</th>
                        <th>Assignée à</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Les tâches seront ajoutées dynamiquement ici -->
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 To-Do List G3. Tous droits réservés.</p>
    </footer>

    <!-- Modal pour ajouter un utilisateur -->
    <div id="addUserModal" class="modal hidden" data-modal="user">
        <div class="modal-content">
            <span class="close-btn" id="closeUserModal">&times;</span>
            <!-- Formulaire pour ajouter un utilisateur -->
            <form id="addUserForm">
                <label for="fullname">Nom complet:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Votre nom complet" required>
                <button type="submit" class="btn">Ajouter</button>
            </form>
        </div>
    </div>
    <!-- Modal pour ajouter une tâche -->
    <div id="addTaskModal" class="modal hidden" data-modal="task">
        <div class="modal-content">
            <span class="close-btn" id="closeTaskModal">&times;</span>
            <!-- Formulaire pour ajouter une tâche -->
            <form id="addTaskForm">
                <label for="taskTitle">Nom de la tâche:</label>
                <input type="text" id="taskTitle" name="taskTitle" placeholder="Nom de la tâche" required>
                <label for="selectedUser">Assigner cette tâche à:</label>
                <select id="selectedUser" name="selectedUser">
                    <option value="">Sélectionnez un utilisateur</option>
                    <!-- Les options seront remplis dynamiquement au moment de l'ouverture du modal -->
                </select>
                <button type="submit" class="btn">Ajouter</button>
                <!-- On peut avoir une tache sans utilisateur -->
            </form>
        </div>
    </div>
    <!-- Modal de confirmation de suppression -->
    <div id="confirmModal" class="modal hidden" data-modal="confirm">
        <div class="modal-content">
            <p class="conf-para">Êtes-vous sûr de vouloir supprimer ?</p>
            <button id="confirmDeleteBtn" class="confirmDeleteBtn">Supprimer</button>
            <button id="cancelDeleteBtn" class="btn">Annuler</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
